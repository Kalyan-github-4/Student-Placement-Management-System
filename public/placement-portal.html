<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple student placement management portal."
    />
    <title>Placement Portal</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: linear-gradient(135deg, #eff6ff, #dbeafe);
        color: #1e3a5f;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(30, 58, 95, 0.16);
        max-width: 560px;
        padding: 48px 36px;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        margin: 0 0 16px;
      }

      p {
        color: #475569;
        line-height: 1.6;
        margin: 0 0 28px;
      }

      a {
        background: #2563eb;
        border-radius: 8px;
        color: #ffffff;
        display: inline-block;
        font-weight: 700;
        padding: 12px 20px;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Student Placement Portal</h1>
      <p>
        A simple place for students to explore placement opportunities and
        begin their career journey.
      </p>
      <a href="/">Visit the main portal</a>
    </main>
  </body>
</html>
